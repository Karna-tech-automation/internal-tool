<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .terminal { 
      background-color: #1e1e1e; 
      color: #00ff00; 
      font-family: 'Courier New', Courier, monospace; 
      height: 600px; 
      overflow-y: auto; 
      padding: 15px; 
      border-radius: 8px;
      font-size: 14px;
    }
    .terminal-line { margin-bottom: 4px; }
    .job-card { transition: all 0.3s ease; border-top: 4px solid #ccc; }
    .job-card.running { border-top-color: #ffc107; background-color: #fffdf5; }
    .job-card.passed { border-top-color: #198754; background-color: #f8fff9; }
    .job-card.failed { border-top-color: #dc3545; background-color: #fff8f8; }
    .evidence-img { 
      width: 100%; 
      border-radius: 4px; 
      margin-top: 8px; 
      border: 2px solid #dc3545; 
      cursor: pointer; 
    }
    .evidence-img:hover { opacity: 0.8; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">⚙️ Internal Automation Tool</span>
  </div>
</nav>

<div class="container-fluid">
  <!-- Top Controls -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <input type="file" id="fileInput" class="form-control" style="max-width: 300px;" accept=".xlsx,.json" />
          <button id="uploadBtn" class="btn btn-secondary">1. Upload File</button>
          <button id="startBtn" class="btn btn-primary" disabled>2. Start Jobs</button>
          <button id="downloadBtn" class="btn btn-success ms-auto" disabled>3. Download Excel Report</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Left Side: Terminal -->
    <div class="col-md-4 mb-4">
      <div class="terminal" id="terminalBox">
        <div class="terminal-line">System Ready...</div>
      </div>
    </div>

    <!-- Right Side: Job Cards -->
    <div class="col-md-8">
      <div class="row" id="jobContainer">
        <div class="col-12 text-muted text-center mt-5">No jobs running. Upload a file and click Start.</div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (Required for Collapse/Expand) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const startBtn = document.getElementById('startBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const terminalBox = document.getElementById('terminalBox');
  const jobContainer = document.getElementById('jobContainer');

  let localLogs = [];
  let lastRenderedBatch = ''; 

  // 1. Upload
  uploadBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) return alert('Choose a file first');

    const formData = new FormData();
    formData.append('file', file);

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';

    try {
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(await res.text());
      uploadBtn.textContent = 'Uploaded ✓';
    } catch (err) {
      alert('Upload failed: ' + err.message);
      uploadBtn.textContent = '1. Upload File';
      uploadBtn.disabled = false;
    }
  });

  // 2. Start
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Starting...';
    lastRenderedBatch = ''; 
    
    try {
      await fetch('/api/start', { method: 'POST' });
      downloadBtn.disabled = true;
    } catch (err) {
      alert('Failed to start: ' + err.message);
      startBtn.disabled = false;
      startBtn.textContent = '2. Start Jobs';
    }
  });

  // 3. Download
  downloadBtn.addEventListener('click', () => {
    window.location.href = '/api/download-report';
  });

  // Polling
  async function poll() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();

      // Handle Logs
      if (data.logs.length !== localLogs.length) {
        localLogs = data.logs;
        const isScrolledToBottom = terminalBox.scrollHeight - terminalBox.clientHeight <= terminalBox.scrollTop + 50;
        terminalBox.innerHTML = data.logs.map(log => 
          `<div class="terminal-line"><span style="color:#888;">[${log.time}]</span> ${log.message}</div>`
        ).join('');
        if (isScrolledToBottom) terminalBox.scrollTop = terminalBox.scrollHeight; 
      }

      // Handle Buttons
      if (data.status === 'idle' && data.parsedData.length > 0) {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Uploaded ✓';
        startBtn.disabled = false;
        startBtn.textContent = '2. Start Jobs';
        downloadBtn.disabled = false;
      } else if (data.status === 'Running') {
        startBtn.disabled = true;
        startBtn.textContent = 'Running...';
        downloadBtn.disabled = true;
      }

      // Handle Job Cards
      if (data.batchProgress && data.batchProgress.length > 0) {
        
        // Convert to string to check if we actually need to re-render (prevents blinking)
        const currentStateString = JSON.stringify(data.batchProgress);
        
        if (currentStateString !== lastRenderedBatch) {
          lastRenderedBatch = currentStateString;
          
          let html = '';
          data.batchProgress.forEach((job) => {
            html += generateJobCardHtml(job);
          });
          jobContainer.innerHTML = html;
        }
      } else {
        jobContainer.innerHTML = `<div class="col-12 text-muted text-center mt-5">No jobs running. Upload a file and click Start.</div>`;
      }

    } catch (err) {
      console.error('Polling error:', err);
    }
  }

  // Helper function to generate the HTML for a single job card
  function generateJobCardHtml(job) {
    let badgeClass = 'bg-secondary';
    let cardClass = '';
    
    if (job.status === 'Running') { badgeClass = 'bg-warning text-dark'; cardClass = 'running'; }
    if (job.status === 'Passed') { badgeClass = 'bg-success'; cardClass = 'passed'; }
    if (job.status === 'Failed') { badgeClass = 'bg-danger'; cardClass = 'failed'; }

    let evidenceHtml = '';
    
    // If it fails, show a collapsible button for screenshots
    if (job.status === 'Failed') {
      const cacheBuster = Date.now();
      evidenceHtml = `
        <div class="mt-3">
          <button class="btn btn-sm btn-outline-danger fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#evidence-${job.jobId}">
            🔍 View Failure Evidence
          </button>
          <div class="collapse" id="evidence-${job.jobId}">
            <div class="mt-2">
              <a href="/evidence/${job.jobId}/01_Fill_Input.png" target="_blank">
                <img src="/evidence/${job.jobId}/01_Fill_Input.png?t=${cacheBuster}" class="evidence-img" alt="Input">
              </a>
              <a href="/evidence/${job.jobId}/02_Before_Click_Submit.png" target="_blank">
                <img src="/evidence/${job.jobId}/02_Before_Click_Submit.png?t=${cacheBuster}" class="evidence-img" alt="Submit">
              </a>
            </div>
          </div>
        </div>
      `;
    } else if (job.status === 'Passed') {
      evidenceHtml = `
        <div class="mt-3 text-success" style="font-size: 0.9rem;">
          ✓ Screenshots saved to local evidence folder.
        </div>
      `;
    } else if (job.status === 'Running') {
      evidenceHtml = `
        <div class="mt-3 text-center text-muted">
          <div class="spinner-border spinner-border-sm" role="status"></div> Processing...
        </div>
      `;
    }

    return `
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm job-card ${cardClass}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="card-title mb-0">${job.jobId}</h5>
              <span class="badge ${badgeClass}">${job.status}</span>
            </div>
            <p class="card-text mb-1"><strong>Project:</strong> ${job.projectName}</p>
            <p class="card-text mb-1"><strong>Env:</strong> ${job.environment}</p>
            ${evidenceHtml}
          </div>
        </div>
      </div>
    `;
  }

  poll();
  setInterval(poll, 2000);
</script>

</body>
</html>
