<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .terminal { 
      background-color: #1e1e1e; color: #00ff00; font-family: 'Courier New', monospace; 
      height: 550px; overflow-y: auto; padding: 15px; border-radius: 8px; font-size: 14px;
    }
    .terminal-line { margin-bottom: 4px; }
    .job-card { transition: all 0.3s ease; border-top: 4px solid #ccc; }
    .job-card.running { border-top-color: #ffc107; background-color: #fffdf5; }
    .job-card.passed { border-top-color: #198754; background-color: #f8fff9; }
    .job-card.failed { border-top-color: #dc3545; background-color: #fff8f8; }
    .evidence-img { width: 100%; border-radius: 4px; margin-top: 8px; border: 2px solid #dc3545; cursor: pointer; }
    .evidence-img:hover { opacity: 0.8; }
    .evidence-manager { background: #fff; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
    .evidence-header { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #f8f9fa; border-radius: 8px; }
    .evidence-body { padding: 15px; border-top: 1px solid #ddd; display: none; }
    .evidence-body.show { display: block; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">⚙️ Internal Automation Tool</span>
  </div>
</nav>

<div class="container-fluid">
  <div class="row mb-3">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <input type="file" id="fileInput" class="form-control" style="max-width: 250px;" accept=".xlsx,.json" />
          <button id="uploadBtn" class="btn btn-secondary">1. Upload File</button>
          
          <button id="startBtn" class="btn btn-primary" disabled>2. Start Jobs</button>
          <button id="retryBtn" class="btn btn-warning" style="display: none;">🔄 Retry Failed</button>
          <button id="stopBtn" class="btn btn-danger" style="display: none;">🛑 Stop Process</button>
          
          <button id="downloadBtn" class="btn btn-success ms-auto" disabled>3. Download Excel Report</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-12">
      <div class="evidence-manager">
        <div class="evidence-header" onclick="toggleEvidence()">
          <span>📁 Evidence Manager (Screenshots)</span>
          <span id="evidenceToggleIcon">▼</span>
        </div>
        <div class="evidence-body" id="evidenceBody">
          <p class="text-muted mb-3">Download all screenshots from the current run, or clear them to free up space.</p>
          <button id="downloadEvidenceBtn" class="btn btn-success me-2">⬇️ Download Evidence</button>
          <button id="deleteEvidenceBtn" class="btn btn-danger">🗑️ Delete Evidence</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-4" id="progressContainer" style="display: none;">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-end mb-1">
        <div>
          <span class="fw-bold text-muted me-3">Overall Progress</span>
          <!-- NEW: Filter Toggle -->
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="filterFailed">
            <label class="form-check-label text-danger fw-bold" for="filterFailed" style="cursor: pointer;">Show Failed Only</label>
          </div>
        </div>
        <span class="fw-bold" id="progressText">0 / 0</span>
      </div>
      <div class="progress" style="height: 20px;">
        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%;"></div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="terminal" id="terminalBox">
        <div class="terminal-line">System Ready...</div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="row" id="jobContainer">
        <div class="col-12 text-muted text-center mt-5">No jobs running. Upload a file and click Start.</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const stopBtn = document.getElementById('stopBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const filterFailedCheckbox = document.getElementById('filterFailed');
  const terminalBox = document.getElementById('terminalBox');
  const jobContainer = document.getElementById('jobContainer');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  let localLogs = [];
  let lastRenderedBatch = ''; 
  let isNewFileSelected = false;
  let filterFailedOnly = false;

  // Evidence Manager Logic
  function toggleEvidence() {
    const body = document.getElementById('evidenceBody');
    const icon = document.getElementById('evidenceToggleIcon');
    body.classList.toggle('show');
    icon.textContent = body.classList.contains('show') ? '▲' : '▼';
  }

  document.getElementById('downloadEvidenceBtn').addEventListener('click', () => window.location.href = '/api/download-evidence');
  document.getElementById('deleteEvidenceBtn').addEventListener('click', async () => {
    if (!confirm('Are you sure you want to delete all evidence?')) return;
    await fetch('/api/delete-evidence', { method: 'DELETE' });
    alert('Evidence folder cleared!');
  });

  // Filter Toggle
  filterFailedCheckbox.addEventListener('change', (e) => {
    filterFailedOnly = e.target.checked;
    lastRenderedBatch = ''; // Force re-render immediately
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      isNewFileSelected = true;
      uploadBtn.disabled = false;
      uploadBtn.textContent = '1. Upload File';
      startBtn.disabled = true;
      downloadBtn.disabled = true;
      jobContainer.innerHTML = `<div class="col-12 text-muted text-center mt-5">File selected. Click Upload to process.</div>`;
      progressContainer.style.display = 'none';
    }
  });

  uploadBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) return alert('Choose a file first');

    isNewFileSelected = false; 
    const formData = new FormData();
    formData.append('file', file);
    
    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';
    
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(await res.text());
      uploadBtn.textContent = 'Uploaded ✓';
    } catch (err) {
      alert('Upload failed: ' + err.message);
      uploadBtn.textContent = '1. Upload File';
      uploadBtn.disabled = false;
    }
  });

  async function triggerStart(isRetry) {
    startBtn.disabled = true;
    retryBtn.disabled = true;
    stopBtn.style.display = 'inline-block';
    lastRenderedBatch = ''; 
    try {
      const res = await fetch('/api/start', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ retryFailed: isRetry })
      });
      if (!res.ok) throw new Error(await res.text());
      downloadBtn.disabled = true;
    } catch (err) {
      alert('Failed to start: ' + err.message);
      startBtn.disabled = false;
      retryBtn.disabled = false;
      stopBtn.style.display = 'none';
    }
  }

  startBtn.addEventListener('click', () => triggerStart(false));
  retryBtn.addEventListener('click', () => triggerStart(true));

  stopBtn.addEventListener('click', async () => {
    stopBtn.disabled = true;
    stopBtn.textContent = 'Stopping...';
    await fetch('/api/stop', { method: 'POST' });
    stopBtn.style.display = 'none';
    stopBtn.disabled = false;
    stopBtn.textContent = '🛑 Stop Process';
  });

  downloadBtn.addEventListener('click', () => window.location.href = '/api/download-report');

  async function poll() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();

      if (data.logs.length !== localLogs.length) {
        localLogs = data.logs;
        const isScrolledToBottom = terminalBox.scrollHeight - terminalBox.clientHeight <= terminalBox.scrollTop + 50;
        terminalBox.innerHTML = data.logs.map(log => 
          `<div class="terminal-line"><span style="color:#888;">[${log.time}]</span> ${log.message}</div>`
        ).join('');
        if (isScrolledToBottom) terminalBox.scrollTop = terminalBox.scrollHeight; 
      }

      const hasFailures = data.batchProgress && data.batchProgress.some(j => j.status === 'Failed');

      if (data.status === 'idle' && data.parsedData.length > 0) {
        if (!isNewFileSelected) {
          uploadBtn.disabled = true; 
          uploadBtn.textContent = 'Uploaded ✓';
          startBtn.disabled = false;
          if (data.completedJobs > 0) downloadBtn.disabled = false;
        } else {
          startBtn.disabled = true;
        }
        stopBtn.style.display = 'none';
        
        // Show/Hide Retry Button
        if (hasFailures) {
          retryBtn.style.display = 'inline-block';
          retryBtn.disabled = false;
        } else {
          retryBtn.style.display = 'none';
        }

      } else if (data.status === 'Running') {
        startBtn.disabled = true;
        retryBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        downloadBtn.disabled = true;
      }

      if (data.totalJobs > 0 && !isNewFileSelected) {
        progressContainer.style.display = 'flex';
        const percent = Math.round((data.completedJobs / data.totalJobs) * 100);
        progressBar.style.width = `${percent}%`;
        progressText.textContent = `${data.completedJobs} / ${data.totalJobs} Jobs`;
        if(percent === 100) progressBar.classList.remove('progress-bar-animated');
      } else {
        progressContainer.style.display = 'none';
      }

      // Handle Job Cards with Filtering
      if (data.batchProgress && data.batchProgress.length > 0 && !isNewFileSelected) {
        // We append the filter state to the string so the UI re-renders when the checkbox changes
        const currentStateString = JSON.stringify(data.batchProgress) + filterFailedOnly;
        
        if (currentStateString !== lastRenderedBatch) {
          lastRenderedBatch = currentStateString;
          
          let html = '';
          data.batchProgress.forEach((job) => {
            if (filterFailedOnly && job.status !== 'Failed') return; // Skip passed jobs if filter is on
            html += generateJobCardHtml(job);
          });
          
          if (html === '') {
            html = `<div class="col-12 text-success text-center mt-5 fw-bold">🎉 No failed jobs! Everything passed.</div>`;
          }
          
          jobContainer.innerHTML = html;
        }
      } else if (!isNewFileSelected) {
        jobContainer.innerHTML = `<div class="col-12 text-muted text-center mt-5">No jobs running.</div>`;
      }

    } catch (err) { console.error('Polling error:', err); }
  }

  function generateJobCardHtml(job) {
    let badgeClass = 'bg-secondary', cardClass = '';
    if (job.status === 'Running') { badgeClass = 'bg-warning text-dark'; cardClass = 'running'; }
    if (job.status === 'Passed') { badgeClass = 'bg-success'; cardClass = 'passed'; }
    if (job.status === 'Failed') { badgeClass = 'bg-danger'; cardClass = 'failed'; }

    let evidenceHtml = '';
        if (job.status === 'Failed') {
      const cacheBuster = Date.now();
      evidenceHtml = `
        <div class="mt-3">
          <button class="btn btn-sm btn-outline-danger fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#evidence-${job.jobId}">
            🔍 View Failure Evidence
          </button>
          <div class="collapse" id="evidence-${job.jobId}">
            <div class="mt-2">
              <!-- The failure state is always taken -->
              <a href="/evidence/${job.jobId}/99_Failure_State.png" target="_blank">
                <img src="/evidence/${job.jobId}/99_Failure_State.png?t=${cacheBuster}" class="evidence-img" alt="Failure" onerror="this.style.display='none'">
              </a>
              <!-- These will only show if the script actually reached them -->
              <a href="/evidence/${job.jobId}/01_Project_Created.png" target="_blank">
                <img src="/evidence/${job.jobId}/01_Project_Created.png?t=${cacheBuster}" class="evidence-img" alt="Input" onerror="this.style.display='none'">
              </a>
              <a href="/evidence/${job.jobId}/02_Transmitted_Success.png" target="_blank">
                <img src="/evidence/${job.jobId}/02_Transmitted_Success.png?t=${cacheBuster}" class="evidence-img" alt="Submit" onerror="this.style.display='none'">
              </a>
            </div>
          </div>
        </div>`;
    } else if (job.status === 'Passed') {
      evidenceHtml = `<div class="mt-3 text-success" style="font-size: 0.9rem;">✓ Screenshots saved to evidence folder.</div>`;
    } else if (job.status === 'Running') {
      evidenceHtml = `<div class="mt-3 text-center text-muted"><div class="spinner-border spinner-border-sm" role="status"></div> Processing...</div>`;
    }

    return `
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm job-card ${cardClass}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="card-title mb-0">${job.jobId}</h5>
              <div>
                ${job.duration ? `<span class="badge bg-secondary me-2">⏱ ${job.duration}</span>` : ''}
                <span class="badge ${badgeClass}">${job.status}</span>
              </div>
            </div>
            <p class="card-text mb-1"><strong>Project:</strong> ${job.projectName}</p>
            <p class="card-text mb-1"><strong>Env:</strong> ${job.environment}</p>
            ${evidenceHtml}
          </div>
        </div>
      </div>`;
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
